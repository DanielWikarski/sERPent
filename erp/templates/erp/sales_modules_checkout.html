{% extends 'erp/base.html' %}
{% block main_content %}
{% csrf_token %}
<!-- {% csrf_token %} jest potrzebne dla Django, aby wykonać metody POST, PUT i DELETE. Zamieszczenie takiego tokena to takie zabezpieczenie -->
<div class="basket_summary_container">
    <p class="basket_summary_header">Basket summary</p>
    <div class="basket_summary"></div>
</div>

{% endblock %}

{% block sidebar_content %}
<div class="sidebar_card">
    <p class="sidebar_title">Order finalisation</p>
    <div class="table_breaker_light"></div>
    
    <div class="payment_section">
    <p class="subtext">Choose payment method</p>
    
    <label class="payment_selection_choice" for="card">
        <input type="radio" name="payment_method" id="card" value="card">
        <p>Card</p>
        <svg class="icon_standard_size icon_tint" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M64 192L64 224L576 224L576 192C576 156.7 547.3 128 512 128L128 128C92.7 128 64 156.7 64 192zM64 272L64 448C64 483.3 92.7 512 128 512L512 512C547.3 512 576 483.3 576 448L576 272L64 272zM128 424C128 410.7 138.7 400 152 400L200 400C213.3 400 224 410.7 224 424C224 437.3 213.3 448 200 448L152 448C138.7 448 128 437.3 128 424zM272 424C272 410.7 282.7 400 296 400L360 400C373.3 400 384 410.7 384 424C384 437.3 373.3 448 360 448L296 448C282.7 448 272 437.3 272 424z"/></svg>
    </label>

    <label class="payment_selection_choice" for="cash">
        <input type="radio" name="payment_method" id="cash" checked value="cash">
        <p>Cash</p>
        <svg class="icon_standard_size icon_tint" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M192 160L192 144C192 99.8 278 64 384 64C490 64 576 99.8 576 144L576 160C576 190.6 534.7 217.2 474 230.7C471.6 227.9 469.1 225.2 466.6 222.7C451.1 207.4 431.1 195.8 410.2 187.2C368.3 169.7 313.7 160.1 256 160.1C234.1 160.1 212.7 161.5 192.2 164.2C192 162.9 192 161.5 192 160.1zM496 417L496 370.8C511.1 366.9 525.3 362.3 538.2 356.9C551.4 351.4 564.3 344.7 576 336.6L576 352C576 378.8 544.5 402.5 496 417zM496 321L496 288C496 283.5 495.6 279.2 495 275C510.5 271.1 525 266.4 538.2 260.8C551.4 255.2 564.3 248.6 576 240.5L576 255.9C576 282.7 544.5 306.4 496 320.9zM64 304L64 288C64 243.8 150 208 256 208C362 208 448 243.8 448 288L448 304C448 348.2 362 384 256 384C150 384 64 348.2 64 304zM448 400C448 444.2 362 480 256 480C150 480 64 444.2 64 400L64 384.6C75.6 392.7 88.5 399.3 101.8 404.9C143.7 422.4 198.3 432 256 432C313.7 432 368.3 422.3 410.2 404.9C423.4 399.4 436.3 392.7 448 384.6L448 400zM448 480.6L448 496C448 540.2 362 576 256 576C150 576 64 540.2 64 496L64 480.6C75.6 488.7 88.5 495.3 101.8 500.9C143.7 518.4 198.3 528 256 528C313.7 528 368.3 518.3 410.2 500.9C423.4 495.4 436.3 488.7 448 480.6z"/></svg>
    </label>
</div>

    <div class="total_window">
        <div class="table_breaker_light"></div>
        <div class="total_amount_container"><p class="total_amount" id="checkout_total_text"></p><p>zł</p></div>
        <p class="subtext" style="text-align: left; margin: 5px 0px 10px 0px;">total amount</p>

        <button id="final_pay_btn" >
            <p>Accept payment and finalise transaction </p>
        </button>
    </div>
</div>


<!-- Skrypt odpowiadający za wyświetlanie koszyka-->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const savedBasketText = localStorage.getItem('active_basket');
    // Tutaj przechwytuje zapisany koszyk z poprzedniej karty, który zapisałem w localeStorage

    // Zamieniam tekst przekazany z poprzedniem karty na obiekt JSON, aby móc po nim iterować
    const basket = JSON.parse(savedBasketText);
    const total_amount = document.querySelector(".total_amount")
    let total_amount_value = 0
    // Iteruje przez obiekt basket i dla każdego elementu tworzę okno produktu dodanego do koszyka
    Object.values(basket).forEach(product => {
        // produkty będą dodawane do pustego diva na górze basket_item_list
        const basket_summary = document.querySelector(".basket_summary")
        // render diva, dodanie do niego dane o produkcie z koszyka
        const productWindow = document.createElement("div");
        productWindow.className = "add_product_window";
        productWindow.innerHTML = `
        <div class="add_product_item_name">
            <p>${product["name"]}</p>
        </div>
        <p class="subtext subtext_unit_type" style="text-align:left" >Product name</p>
        <div class="table_breaker_light"></div>
        <div class ="add_product_item_qty">
            <p>${product["qty"]} Qty.</p>
        </div>
        <p class="subtext subtext_unit_type" style="text-align:left" >item quantity</p>
        <div class="table_breaker_light"></div>
        <div class="add_product_item_price">
            <p class="price_amount">${product["price"].toFixed(2)} zł.</p>
        </div>
        <p class="subtext subtext_unit_type" style="text-align:left" >Unit price (netto)</p>
        <div class="table_breaker_light"></div>
        <div class="add_product_item_price">
            <p class="price_amount">${product["price"].toFixed(2)*product["qty"]} zł.</p>
        </div>
        <p class="subtext subtext_unit_type" style="text-align:left" >Total price (unit price x qty.)</p>
        `
        total_amount_value += parseFloat(product["price"].toFixed(2))*parseFloat(product["qty"])
        basket_summary.appendChild(productWindow)
        total_amount.innerHTML = parseFloat(total_amount_value).toFixed(2)
    });
});


// Obsługa przycisku finalise, zdejmuje ze stanu produkty i dodaje do salda kwotę transakcji
const total_amount = document.querySelector(".total_amount")
document.getElementById('final_pay_btn').addEventListener('click', function() {
    const savedBasketText = localStorage.getItem('active_basket');
    // pobieram dane z koszyka z localStorage
    // pobieram token dla Django, a dokładnie element {% csrf_token %}
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    // Zamieniam koszyk na obiekt
    const basket = JSON.parse(savedBasketText);
    
    //Pobieram opcje płatności jaką zaznaczył user
    const selectedPayment = document.querySelector('input[name="payment_method"]:checked').value;
    let total_amount_value = total_amount.textContent
    total_amount_value = parseFloat(total_amount_value).toFixed(2)

    // Wysyłamy do Django dane, które pobraliśmy
    fetch("/finalize_transaction/", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
        },
        body: JSON.stringify({
            basket: basket,
            payment_method: selectedPayment,
            total_amount: total_amount_value
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            console.info("SUCCESS");
            localStorage.removeItem('active_basket'); 
            // Czyścimy koszyk, żeby po transakcji się nie zapisywał
            window.location.href = '/';
            // lecimy na stronę główną jak się uda wszystko
        } else {
            console.error("Error:" + data.message);
        }
    })
    .catch(error => {
        console.error("Error:", error);
    });
});
</script>
{% endblock %}
